[project]
name = "ml-churn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aurelien Vallet", email = "a.vallet@openium.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "codecarbon>=3.3.1",
    "evidently>=0.7.21",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "prefect>=3.8.5",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "xgboost>=3.4.1",
]

[project.scripts]
ml-churn = "ml_churn:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.6",
]
