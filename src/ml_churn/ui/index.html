<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ml-churn — test de l'API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ml-churn — test de l'API</h1>
  <p class="subtitle">Vingt clients tirés du jeu de test et légèrement modifiés.
     Les prédictions partent seules dès que le service répond : un appel à
     <code>/predict-churn</code> et un à <code>/predict-clv</code> par client.</p>

  <div class="status" id="status">
    <span class="dot" id="dot-health"></span><code>/health</code>
    <span class="dot" id="dot-ready"></span><code>/ready</code>
    <span class="status-detail" id="status-detail">vérification…</span>
  </div>

  <div class="toolbar">
    <span class="progress" id="progress"></span>
  </div>

  <p id="error" class="error"></p>

  <div class="table-wrapper">
    <table id="clients">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <script src="clients.js"></script>
  <script src="app.js"></script>
</body>
</html>
